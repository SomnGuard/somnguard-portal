name: Portal CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build container image
        run: docker build --build-arg VITE_API_URL=http://localhost:8080/api/v1 -t somnguard-portal:ci .

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --reporter=verbose
